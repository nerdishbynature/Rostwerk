[workspace]
resolver = "3"
members = [
    "crates/core-kernel",
    "crates/core-host",
    "crates/module-masterdata",
    "crates/event-nats",
    "apps/api-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nerdishbynature/Rostwerk"
publish = false

[workspace.dependencies]
core-kernel = { path = "crates/core-kernel" }
core-host = { path = "crates/core-host" }
module-masterdata = { path = "crates/module-masterdata" }
event-nats = { path = "crates/event-nats" }

anyhow = "1"
async-nats = "0.53"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
http-body-util = "0.1"
jsonwebtoken = { version = "12", default-features = false, features = ["use_pem", "rust_crypto"] }
p256 = { version = "0.13", features = ["jwk", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
    "rust_decimal",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v7", "serde"] }
