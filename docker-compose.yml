services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rostwerk
      POSTGRES_USER: rostwerk_admin
      POSTGRES_PASSWORD: rostwerk_admin
    ports:
      - "54329:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rostwerk_admin -d rostwerk"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
