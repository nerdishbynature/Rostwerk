services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rostwerk
      POSTGRES_USER: rostwerk_admin
      POSTGRES_PASSWORD: rostwerk_admin
    ports:
      - "54329:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rostwerk_admin -d rostwerk"]
      interval: 2s
      timeout: 3s
      retries: 30

  # OIDC provider for development. Imports docker/keycloak/rostwerk-realm.json
  # on first start (realm "rostwerk", user alice/alice, clients rostwerk-docs
  # and rostwerk-agent). Admin console: http://localhost:8180 (admin/admin).
  # Dev mode keeps its state inside the container; recreate it to reset.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixed issuer, so tokens carry the same `iss` however Keycloak is reached.
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  # Event bus. The outbox relay publishes to JetStream stream ROSTWERK
  # (subjects rostwerk.<tenant>.<topic>). Monitoring: http://localhost:8222
  nats:
    image: nats:2
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data

volumes:
  pgdata:
  natsdata:
